name: Update Pick Desk
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build page
        run: python3 build.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Publish
        run: |
          git config user.name "Pick Desk Bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
